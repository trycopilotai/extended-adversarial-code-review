<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title description">
  <title id="title">Animated round_yield.py session</title>
  <desc id="description">A terminal runs round_yield.py with --explain on a synthetic record. It prints the yield curve, the state of each of seven stopping clauses, and the verdict with its exit status.</desc>
  <style>
    .step-1 {
      opacity: 0;
      animation: reveal-1 12s infinite;
    }
    @keyframes reveal-1 {
      0%, 8% { opacity: 0; }
      12%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }
    .step-2 {
      opacity: 0;
      animation: reveal-2 12s infinite;
    }
    @keyframes reveal-2 {
      0%, 36% { opacity: 0; }
      40%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }
    .step-3 {
      opacity: 0;
      animation: reveal-3 12s infinite;
    }
    @keyframes reveal-3 {
      0%, 66% { opacity: 0; }
      70%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .step-1, .step-2, .step-3 {
        opacity: 1;
        animation: none;
      }
    }
  </style>
  <rect width="1280" height="680" rx="24" fill="#101418" />
  <circle cx="40" cy="44" r="9" fill="#ff6b6b" />
  <circle cx="70" cy="44" r="9" fill="#ffd166" />
  <circle cx="100" cy="44" r="9" fill="#55d6be" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="40" y="112" fill="#f7fbff" xml:space="preserve">$ python3 skills/extended-adversarial-code-review/scripts/round_yield.py --explain examples/rounds.json</text>
    <g class="step-1">
      <text x="40" y="154" fill="#a7bac5" xml:space="preserve">yield curve</text>
      <text x="40" y="182" fill="#f7fbff" xml:space="preserve">  round 1   claims 30   fixed 12   user-visible 4   </text>
      <text x="40" y="210" fill="#f7fbff" xml:space="preserve">  round 2   claims 28   fixed 11   user-visible 2      &lt;- 1 self-inflicted</text>
      <text x="40" y="238" fill="#f7fbff" xml:space="preserve">  round 3   claims 31   fixed 9    user-visible 0      &lt;- 3 self-inflicted</text>
    </g>
    <g class="step-2">
      <text x="40" y="280" fill="#a7bac5" xml:space="preserve">clauses</text>
      <text x="40" y="308" fill="#ffd166" xml:space="preserve">  FIRED clause 1: unbounded fix domain</text>
      <text x="40" y="336" fill="#ffd166" xml:space="preserve">  FIRED clause 2: one design defect, reported N times</text>
      <text x="40" y="364" fill="#ffd166" xml:space="preserve">  FIRED clause 3: a fix from an earlier round broke something</text>
      <text x="40" y="392" fill="#ffd166" xml:space="preserve">  FIRED clause 4: over a quarter of the round was cleanup</text>
      <text x="40" y="420" fill="#ffd166" xml:space="preserve">  FIRED clause 5: fixed-defect yield flat or falling</text>
      <text x="40" y="448" fill="#55d6be" xml:space="preserve">  quiet clause 6: two rounds with nothing user-visible</text>
      <text x="40" y="476" fill="#ffd166" xml:space="preserve">  FIRED clause 7: past the declared token ceiling</text>
    </g>
    <g class="step-3">
      <text x="40" y="518" fill="#ffd166" xml:space="preserve">STOP</text>
      <text x="40" y="546" fill="#f7fbff" xml:space="preserve">$ echo &quot;exit status: $?&quot;</text>
      <text x="40" y="574" fill="#f7fbff" xml:space="preserve">exit status: 1</text>
    </g>
  </g>
  <text x="40" y="652" fill="#a7bac5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Reconstructed from evidence/transcripts/round-yield-explain.txt</text>
</svg>
